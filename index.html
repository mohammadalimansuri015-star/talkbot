<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talk Bot AI</title>
    
    <!-- Canonical Tag & Sitemap Reference -->
    <link rel="canonical" href="https://mohammadalimansuri015-star.github.io/talkbot/" />
    <link rel="sitemap" type="application/xml" title="Sitemap" href="https://mohammadalimansuri015-star.github.io/talkbot/sitemap.xml" />

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .chat-container { width: 400px; max-width: 95%; height: 600px; background: #ffffff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; }
        .chat-header { background: #0084ff; color: white; padding: 15px; text-align: center; font-size: 18px; font-weight: bold; }
        .chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { max-width: 80%; padding: 10px 14px; border-radius: 18px; font-size: 14px; line-height: 1.4; word-wrap: break-word; }
        .user-message { background: #0084ff; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .bot-message { background: #e4e6eb; color: #050505; align-self: flex-start; border-bottom-left-radius: 4px; }
        .chat-input-area { display: flex; padding: 10px; border-top: 1px solid #ddd; background: #fff; }
        .chat-input-area input { flex: 1; padding: 10px 15px; border: 1px solid #ccc; border-radius: 20px; outline: none; font-size: 14px; }
        .chat-input-area button { background: #0084ff; color: white; border: none; padding: 10px 18px; margin-left: 8px; border-radius: 20px; cursor: pointer; font-size: 14px; font-weight: bold; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">Talk Bot AI</div>
    <div class="chat-box" id="chatBox">
        <div class="message bot-message">Namaste! Main aapka Talk Bot AI Assistant hoon. Poochiye aapka kya sawaal hai?</div>
    </div>
    <div class="chat-input-area">
        <input type="text" id="userInput" placeholder="Apna message likhein..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    async function sendMessage() {
        const inputField = document.getElementById("userInput");
        const chatBox = document.getElementById("chatBox");
        const userText = inputField.value.trim();

        if (userText === "") return;

        appendMessage(userText, "user-message");
        inputField.value = "";

        const loadingMessage = appendMessage("Soch raha hoon...", "bot-message");

        try {
            const response = await fetch("https://text.pollinations.ai/" + encodeURIComponent(userText));
            const botReply = await response.text();

            if (botReply) {
                loadingMessage.innerText = botReply;
            } else {
                loadingMessage.innerText = "Kucch galat hua. Phir se try karein.";
            }
        } catch (error) {
            console.error("Error:", error);
            loadingMessage.innerText = "Network Issue: Connection fail ho gaya.";
        }

        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function appendMessage(text, className) {
        const chatBox = document.getElementById("chatBox");
        const messageDiv = document.createElement("div");
        messageDiv.classList.add("message", className);
        messageDiv.innerText = text;
        chatBox.appendChild(messageDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
        return messageDiv;
    }

    function handleKeyPress(event) {
        if (event.key === "Enter") sendMessage();
    }
</script>

</body>
</html>
